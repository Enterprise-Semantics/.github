name: sync-concept-repos
# Per ES-ADR-049 + CR-ES-049
# On push to main in any central Enterprise-Semantics repo, mirror concept-<slug> files.
# Uses GITHUB_TOKEN only.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Concept slug (e.g. agentic-enterprise). Empty = full sync.'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no push)'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Determine slug(s) to sync
        id: slug
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            echo "value=${{ inputs.slug }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=ALL" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync a single concept repo
        if: steps.slug.outputs.value != 'ALL'
        env:
          SLUG: ${{ steps.slug.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e
          CONCEPT_REPO="Enterprise-Semantics/${SLUG}"
          TMP=$(mktemp -d)
          cd "$TMP"
          gh repo clone "$CONCEPT_REPO" concept -- --depth 1
          cd concept

          # Pull canonical content from central repos (via raw.githubusercontent.com)
          mkdir -p kit docs mappings examples visuals

          # Concept record
          gh api "repos/Enterprise-Semantics/enterprise-semantics/contents/concepts/${SLUG}.concept.yaml" --jq '.content' | base64 -d > concept.yaml 2>/dev/null || \
          gh api "repos/Enterprise-Semantics/enterprise-semantics/contents/registry/profiles/${SLUG}.profile.yaml" --jq '.content' | base64 -d > profile.yaml 2>/dev/null || true

          # Kit
          gh api "repos/Enterprise-Semantics/enterprise-semantics-test-probe/contents/tests/kits/${SLUG}/kit.yaml" --jq '.content' | base64 -d > kit/kit.yaml 2>/dev/null || true

          # Tests
          for kind in positive negative; do
            for i in 01 02 03 04 05; do
              gh api "repos/Enterprise-Semantics/enterprise-semantics-test-probe/contents/tests/${SLUG}/${kind}-${i}.yaml" --jq '.content' | base64 -d > "kit/${kind}-${i}.yaml" 2>/dev/null || true
            done
          done

          # Docs
          gh api "repos/Enterprise-Semantics/enterprise-semantics-docs/contents/concepts/${SLUG}.md" --jq '.content' | base64 -d > docs/concept.md 2>/dev/null || true
          gh api "repos/Enterprise-Semantics/enterprise-semantics-docs/contents/conformance/${SLUG}.md" --jq '.content' | base64 -d > docs/conformance.md 2>/dev/null || true
          gh api "repos/Enterprise-Semantics/enterprise-semantics-docs/contents/concepts-enrichment/${SLUG}/target-architectures.md" --jq '.content' | base64 -d > docs/target-architectures.md 2>/dev/null || true
          gh api "repos/Enterprise-Semantics/enterprise-semantics-docs/contents/concepts-enrichment/${SLUG}/capability-maturity-model.yaml" --jq '.content' | base64 -d > docs/capability-maturity-model.yaml 2>/dev/null || true
          gh api "repos/Enterprise-Semantics/enterprise-semantics-docs/contents/concepts-enrichment/${SLUG}/assessment.md" --jq '.content' | base64 -d > docs/assessment.md 2>/dev/null || true
          gh api "repos/Enterprise-Semantics/enterprise-semantics-docs/contents/concepts-enrichment/${SLUG}/measurement.md" --jq '.content' | base64 -d > docs/measurement.md 2>/dev/null || true

          # Mappings
          for ns in wsf opendea dea-catalogs; do
            gh api "repos/Enterprise-Semantics/enterprise-semantics-mappings/contents/mappings/${ns}/${SLUG}.yaml" --jq '.content' | base64 -d > "mappings/${ns}.yaml" 2>/dev/null || true
          done

          # Commit and push
          git config user.name "Emmanuel A. Otchere"
          git config user.email "emmanuel@otchere.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes for ${SLUG}"
          else
            git commit -m "sync: regenerate from canonical sources ; ES-ADR-049 ; cardinal author rule preserved"
            if [ "$DRY_RUN" != "true" ]; then
              git push origin main
            else
              echo "DRY RUN: would push"
            fi
          fi

      - name: Full sync (all 48 repos)
        if: steps.slug.outputs.value == 'ALL'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          SLUGS="action agent agentic agentic-capability agentic-culture agentic-ecosystem agentic-enterprise agentic-network agentic-offering agentic-operations agentic-organization agentic-product agentic-service agentic-system agentic-value-stream agentic-workflow ai-agent authority autonomous-capability autonomous-closed-loop autonomous-culture autonomous-ecosystem autonomous-enterprise autonomous-network autonomous-offering autonomous-operations autonomous-organization autonomous-product autonomous-service autonomous-system autonomous-value-stream capability closed-loop culture enterprise flow intent loop-engineering network offering operations organization product service system value-stage value-stream workflow"
          for SLUG in $SLUGS; do
            echo "=== $SLUG ==="
            # (same logic as single slug - abbreviated here; in production this is a matrix job)
            CONCEPT_REPO="Enterprise-Semantics/${SLUG}"
            if gh workflow run sync-concept-repos.yml -f "slug=${SLUG}" -f "dry_run=${DRY_RUN}" 2>/dev/null; then
              echo "Triggered"
            fi
          done
